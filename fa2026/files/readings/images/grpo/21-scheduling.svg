<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"><title>Fixed-pool synchronous and overlapped scheduling</title><rect width="900" height="330" fill="white"/><g font-family="Arial,sans-serif" font-size="17" fill="#18324f"><text x="15" y="30">Synchronous split: 16 seconds for two batches</text><text x="15" y="84">Sampler</text><text x="15" y="124">Learner</text><rect x="115" y="65" width="270" height="30" rx="3" fill="#dcebf6" stroke="#18324f"/><text x="250.0" y="86" text-anchor="middle">G1</text><rect x="385" y="105" width="90" height="30" rx="3" fill="#fde7bf" stroke="#18324f"/><text x="430.0" y="126" text-anchor="middle">U1</text><rect x="475" y="65" width="270" height="30" rx="3" fill="#dcebf6" stroke="#18324f"/><text x="610.0" y="86" text-anchor="middle">G2</text><rect x="745" y="105" width="90" height="30" rx="3" fill="#fde7bf" stroke="#18324f"/><text x="790.0" y="126" text-anchor="middle">U2</text><text font-size="13" x="115" y="160" text-anchor="middle">0s</text><text font-size="13" x="385" y="160" text-anchor="middle">6s</text><text font-size="13" x="475" y="160" text-anchor="middle">8s</text><text font-size="13" x="655" y="160" text-anchor="middle">12s</text><text font-size="13" x="745" y="160" text-anchor="middle">14s</text><text font-size="13" x="835" y="160" text-anchor="middle">16s</text><text x="15" y="185">Overlap: 14 seconds for two batches; 6 seconds/batch in steady state</text><text x="15" y="239">Sampler</text><text x="15" y="279">Learner</text><rect x="115" y="220" width="270" height="30" rx="3" fill="#dcebf6" stroke="#18324f"/><text x="250.0" y="241" text-anchor="middle">G1</text><rect x="385" y="220" width="270" height="30" rx="3" fill="#dcebf6" stroke="#18324f"/><text x="520.0" y="241" text-anchor="middle">G2</text><rect x="385" y="260" width="90" height="30" rx="3" fill="#fde7bf" stroke="#18324f"/><text x="430.0" y="281" text-anchor="middle">U1</text><rect x="655" y="260" width="90" height="30" rx="3" fill="#fde7bf" stroke="#18324f"/><text x="700.0" y="281" text-anchor="middle">U2</text><text font-size="13" x="115" y="315" text-anchor="middle">0s</text><text font-size="13" x="385" y="315" text-anchor="middle">6s</text><text font-size="13" x="475" y="315" text-anchor="middle">8s</text><text font-size="13" x="655" y="315" text-anchor="middle">12s</text><text font-size="13" x="745" y="315" text-anchor="middle">14s</text><text font-size="13" x="835" y="315" text-anchor="middle">16s</text></g></svg>