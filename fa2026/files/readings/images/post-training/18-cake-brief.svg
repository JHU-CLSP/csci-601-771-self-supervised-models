<svg xmlns="http://www.w3.org/2000/svg" width="560" height="540" viewBox="0 0 560 540" role="img" aria-labelledby="title desc"><title id="title">Steps for making a simple cake</title><desc id="desc">Typeset transcription of the brief candidate response in slide 19. Original example credit: Eric Mitchell.</desc><rect x="1" y="1" width="558" height="538" rx="8" fill="white" stroke="#cbd3df"/><path d="M9 1H551Q559 1 559 9V95H1V9Q1 1 9 1" fill="#edf3fb"/><g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#202831"><text x="32" y="39" font-weight="700" fill="#002d72">What are the steps for making</text><text x="32" y="69" font-weight="700" fill="#002d72">a simple cake?</text><text x="32" y="135" font-weight="700">1.</text><text x="70" y="135">Warm up the oven.</text><text x="32" y="185" font-weight="700">2.</text><text x="70" y="185">Grease a cake pan.</text><text x="32" y="235" font-weight="700">3.</text><text x="70" y="235">Blend dry ingredients in a bowl.</text><text x="32" y="285" font-weight="700">4.</text><text x="70" y="285">Incorporate butter, milk, and vanilla.</text><text x="32" y="335" font-weight="700">5.</text><text x="70" y="335">Mix in the eggs.</text><text x="32" y="385" font-weight="700">6.</text><text x="70" y="385">Pour into the prepared pan.</text><text x="32" y="435" font-weight="700">7.</text><text x="70" y="435">Bake until golden brown.</text><text x="32" y="485" font-weight="700">8.</text><text x="70" y="485">Add frosting if desired.</text></g></svg>