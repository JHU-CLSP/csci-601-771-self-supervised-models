<svg xmlns="http://www.w3.org/2000/svg" width="560" height="690" viewBox="0 0 560 690" role="img" aria-labelledby="title desc"><title id="title">Steps for making a simple cake</title><desc id="desc">Typeset transcription of the detailed candidate response in slide 19. Original example credit: Eric Mitchell.</desc><rect x="1" y="1" width="558" height="688" rx="8" fill="white" stroke="#cbd3df"/><path d="M9 1H551Q559 1 559 9V95H1V9Q1 1 9 1" fill="#edf3fb"/><g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#202831"><text x="32" y="39" font-weight="700" fill="#002d72">What are the steps for making</text><text x="32" y="69" font-weight="700" fill="#002d72">a simple cake?</text><text x="32" y="135" font-weight="700">1.</text><text x="70" y="135">Preheat oven to 350°F (175°C).</text><text x="32" y="185" font-weight="700">2.</text><text x="70" y="185">Grease and flour a cake pan.</text><text x="32" y="235" font-weight="700">3.</text><text x="70" y="235">In a bowl, combine 2 cups flour, 1.5</text><text x="70" y="265">cups sugar, 3.5 tsp baking powder, and a</text><text x="70" y="295">pinch of salt.</text><text x="32" y="345" font-weight="700">4.</text><text x="70" y="345">Add 1/2 cup butter, 1 cup milk, and 2</text><text x="70" y="375">tsp vanilla; mix well.</text><text x="32" y="425" font-weight="700">5.</text><text x="70" y="425">Beat in 3 eggs, one at a time.</text><text x="32" y="475" font-weight="700">6.</text><text x="70" y="475">Pour batter into the pan.</text><text x="32" y="525" font-weight="700">7.</text><text x="70" y="525">Bake for 30–35 minutes or until a</text><text x="70" y="555">toothpick comes out clean.</text><text x="32" y="605" font-weight="700">8.</text><text x="70" y="605">Let cool, then frost or serve as</text><text x="70" y="635">desired.</text></g></svg>